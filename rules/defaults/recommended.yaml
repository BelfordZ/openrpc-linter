  result-description:
    description: "Result should have a description."
    given: "$.methods[*].result"
    severity: "warn"
    then:
      field: "description"
      function: "truthy"
  tag-description:
    description: "Tag should have a description."
    given: "$.methods[*].tags[*]"
    severity: "warn"
    then:
      field: "description"
      function: "truthy"
  error-description:
    description: "Error should have a description."
    given: "$.methods[*].errors[*]"
    severity: "warn"
    then:
      field: "description"
      function: "truthy"
  example-description:
    description: "Example should have a description."
    given: "$.methods[*].examples[*]"
    severity: "warn"
    then:
      field: "description"
      function: "truthy"
  schema-title:
    description: "Schema should have a title. Generators use titles to derive variable and type names downstream."
    given: "$..schema"
    severity: "warn"
    then:
      field: "title"
      function: "truthy"
  schema-description:
    description: "Schema should have a description."
    given: "$..schema"
    severity: "warn"
    then:
      field: "description"
      function: "truthy"
  methods-non-empty:
    description: "Document should declare at least one method."
    given: "$.methods"
    severity: "warn"
    then:
      function: "schema"
      functionOptions:
        type: "array"
        minItems: 1
  method-examples-min:
    description: "Method should have at least one example."
    given: "$.methods[*].examples"
    severity: "warn"
    then:
      function: "schema"
      functionOptions:
        type: "array"
        minItems: 1
  param-count-limit:
    description: "Method should accept no more than four params."
    given: "$.methods[*].params"
    severity: "warn"
    then:
      function: "schema"
      functionOptions:
        type: "array"
        maxItems: 4
